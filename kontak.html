<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Kontak</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #a29bfe, #74b9ff);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      text-align: center;
    }

    .title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #2d3436;
      border-bottom: 2px solid #74b9ff;
      padding-bottom: 10px;
    }

    .info {
      text-align: left;
      font-size: 16px;
      color: #2d3436;
      margin-bottom: 25px;
    }

    .info p {
      margin: 10px 0;
    }

    .info strong {
      color: #636e72;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #dfe6e9;
      font-size: 15px;
      resize: none;
    }

    textarea {
      min-height: 100px;
    }

    .btn-submit {
      margin-top: 10px;
      padding: 12px 25px;
      background: #74b9ff;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn-submit:hover {
      background: #0984e3;
      transform: scale(1.05);
    }

    .btn-back {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #a29bfe;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn-back:hover {
      background: #6c5ce7;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">Hubungi Saya</div>

    <div class="info">
      <p><strong>Alamat:</strong> Kp. Ciburial No. 46, Lembang, Kab. Bandung Barat</p>
      <p><strong>Email:</strong> megaalaelawati@gmail.com</p>
      <p><strong>Telepon:</strong> +62 838-2161-2483</p>
    </div>

    <form>
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
      </div>

      <div class="form-group">
        <label for="email">Alamat Email</label>
        <input type="email" id="email" placeholder="Masukkan email Anda" required>
      </div>

      <div class="form-group">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" placeholder="Tulis pesan Anda..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Kirim Pesan</button>
    </form>

    <a href="index.html" class="btn-back">⬅ Kembali ke Index</a>
  </div>

</body>
</html>
