<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Web Pertama</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #d63031;
            margin-bottom: 10px;
        }

        p {
            color: #2d3436;
            font-size: 16px;
            margin-bottom: 20px;
        }

        ol {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ol li {
            margin: 10px 0;
        }

        ol li a,
        ol li {
            display: block;
            text-decoration: none;
            color: #2d3436;
            background: #f1f2f6;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        ol li a:hover,
        ol li:hover {
            background: #74b9ff;
            color: #fff;
            transform: translateX(5px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Selamat Datang</h1>
        <p>
            Ini adalah halaman latihan pertama pembuatan web dengan HTML pada pelajaran
            berbasis proyek tahun 2025.
        </p>
        <ol>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="data.html">Data</a></li>
            <li><a href="info.html">Info</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ol>
    </div>
</body>

</html>
