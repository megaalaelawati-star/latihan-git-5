<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Data</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #55efc4, #81ecec);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .data-card {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      max-width: 700px;
      width: 100%;
    }

    .title {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #2d3436;
      margin-bottom: 20px;
      border-bottom: 2px solid #55efc4;
      padding-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    table th, table td {
      border: 1px solid #dfe6e9;
      padding: 10px;
      text-align: left;
    }

    table th {
      background: #55efc4;
      color: #2d3436;
    }

    table tr:nth-child(even) {
      background: #f1f2f6;
    }

    .btn-back {
      display: inline-block;
      padding: 10px 20px;
      background: #55efc4;
      color: #2d3436;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn-back:hover {
      background: #00cec9;
      color: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="data-card">
    <div class="title">Halaman Data</div>
    <table>
      <tr>
        <th>No</th>
        <th>Jenis Data</th>
        <th>Keterangan</th>
      </tr>
      <tr>
        <td>1</td>
        <td>NIM / NIK</td>
        <td>1234567890</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Program Studi</td>
        <td>Teknik Informatika</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Angkatan</td>
        <td>2019</td>
      </tr>
      <tr>
        <td>4</td>
        <td>IPK</td>
        <td>3.75</td>
      </tr>
      <tr>
        <td>5</td>
        <td>Status</td>
        <td>Lulus</td>
      </tr>
    </table>

    <a href="index.html" class="btn-back">⬅ Kembali ke Index</a>
  </div>

</body>
</html>
