<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background: #fff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #2d3436;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #74b9ff;
            box-shadow: 0 0 5px rgba(116, 185, 255, 0.8);
        }

        .radio-group,
        .checkbox-group {
            margin: 8px 0 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0984e3;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #74b9ff;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Formulir Pendaftaran</h2>
        <form action="#" method="post">
            <!-- Nama -->
            <label for="nama">Nama Lengkap :</label>
            <input type="text" id="nama" name="nama" required>

            <!-- Nomor HP -->
            <label for="nohp">No HP :</label>
            <input type="text" id="nohp" name="nohp" required>

            <!-- Jenis Kelamin -->
            <label>Jenis Kelamin :</label>
            <div class="radio-group">
                <input type="radio" id="pria" name="jk" value="Pria">
                <label for="pria">Pria</label>
                <br>
                <input type="radio" id="wanita" name="jk" value="Wanita">
                <label for="wanita">Wanita</label>
            </div>

            <!-- Hobi -->
            <label>Hobi :</label>
            <div class="checkbox-group">
                <input type="checkbox" id="mancing" name="hobi" value="Mancing">
                <label for="mancing">Mancing</label>
                <br>
                <input type="checkbox" id="olahraga" name="hobi" value="Olahraga">
                <label for="olahraga">Olahraga</label>
                <br>
                <input type="checkbox" id="membaca" name="hobi" value="Membaca">
                <label for="membaca">Membaca</label>
            </div>

            <!-- Pendidikan Terakhir -->
            <label for="pendidikan">Pendidikan Terakhir :</label>
            <select id="pendidikan" name="pendidikan">
                <option value="sma">SMA/SMK</option>
                <option value="d3">D3</option>
                <option value="s1">S1</option>
                <option value="s2">S2</option>
            </select>

            <!-- Tombol Submit -->
            <button type="submit">Kirim</button>
        </form>
    </div>
</body>

</html>
